name: Spatial lock sync

on:
  push:
    branches:
      - nolane/spatial-agent-shell
    paths:
      - .github/workflows/spatial-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nolane/spatial-agent-shell
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync lockfile for terminal seam"
          git push origin HEAD:nolane/spatial-agent-shell
