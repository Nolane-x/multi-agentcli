name: Spatial terminal RED

on:
  push:
    branches:
      - nolane/spatial-agent-shell
    paths:
      - .github/workflows/spatial-terminal-red.yml

permissions:
  contents: read

jobs:
  terminal-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run terminal ownership seam spec
        run: pnpm exec vitest run packages/api/session-controller/tests/control-terminal.host.spec.ts
