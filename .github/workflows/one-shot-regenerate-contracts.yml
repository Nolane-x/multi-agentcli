name: one-shot contract cleanup

on:
  push:
    branches:
      - nolane/spatial-agent-shell-v2

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[contract-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nolane/spatial-agent-shell-v2
          fetch-depth: 0
      - name: Align source/docs type-equivalence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/subprocess/subprocess/src/types.ts')
          s = p.read_text()
          old = '/** Offset-based readers for collect-mode streams (also readable after exit). */'
          new = '/** Offset-based readers for the streams spawned in collect mode. */'
          if old not in s:
              raise SystemExit('expected source wording not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/one-shot-regenerate-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/subprocess/subprocess/src/types.ts
          git commit -m 'docs: align subprocess type-equivalence contract [contract-cleanup]'
          git push origin HEAD:nolane/spatial-agent-shell-v2
