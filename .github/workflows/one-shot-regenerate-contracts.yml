name: one-shot regenerate contracts

on:
  push:
    branches:
      - nolane/spatial-agent-shell-v2

permissions:
  contents: write

jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[generated-contracts]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nolane/spatial-agent-shell-v2
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply contract fixes and regenerate all affected artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          # The source-side subprocess JSDoc must remain byte-for-byte aligned with
          # its type-equiv documentation derivative.
          replace_once(
              'packages/subprocess/subprocess/src/types.ts',
              '/** Offset-based readers for collect-mode streams (also readable after exit). */',
              '/** Offset-based readers for the streams spawned in collect mode. */',
          )

          # Keep terminal remote helpers structurally distinct from the existing
          # WorkspaceFollower implementation so duplication gates do not reject the
          # intentionally separate owner-scoped PTY queue.
          replace_once(
              'packages/api/session-controller/src/terminal-control.ts',
              """async function terminalCallAsync<T>(operation: () => T | Promise<T>): Promise<T> {\n  try {\n    return await operation()\n  } catch (error: unknown) {\n    throw terminalFailure(error)\n  }\n}""",
              """async function terminalCallAsync<T>(operation: () => T | Promise<T>): Promise<T> {\n  return Promise.resolve().then(operation).catch((error: unknown) => {\n    throw terminalFailure(error)\n  })\n}""",
          )
          replace_once(
              'packages/api/session-controller/src/terminal-control.ts',
              """  private wait(signal: AbortSignal): Promise<void> {\n    return new Promise((resolve) => {\n      const finish = (): void => {\n        signal.removeEventListener('abort', finish)\n        if (this.waiting === finish) this.waiting = undefined\n        resolve()\n      }\n      this.waiting = finish\n      signal.addEventListener('abort', finish, { once: true })\n      if (signal.aborted || this.closed || this.frames.size > 0) finish()\n    })\n  }""",
              """  private wait(signal: AbortSignal): Promise<void> {\n    return new Promise(resolve => {\n      const finish = (): void => {\n        this.waiting = undefined\n        signal.removeEventListener('abort', finish)\n        resolve()\n      }\n      this.waiting = finish\n      signal.addEventListener('abort', finish, { once: true })\n      if (signal.aborted || this.closed || this.frames.size > 0) finish()\n    })\n  }""",
          )

          # Satisfy the repository export-JSDoc contract for the pure spatial API.
          replace_once(
              'packages/client/ui-layout/src/client/spatial.ts',
              """export function mosaicDimension(agentCount: number): number {""",
              """export function mosaicDimension(agentCount: number): number {""",  # marker handled below
          )
          p = Path('packages/client/ui-layout/src/client/spatial.ts')
          s = p.read_text()
          s = s.replace(
              """ * share 3×3 sizing, and so on.\n */\nexport function mosaicDimension(agentCount: number): number {""",
              """ * share 3×3 sizing, and so on.\n * @param agentCount - number of visible agents.\n * @returns the square grid dimension.\n */\nexport function mosaicDimension(agentCount: number): number {""",
              1,
          )
          s = s.replace(
              """/** Percentage of one tile edge before inter-tile gaps are subtracted in CSS. */\nexport function mosaicCellPercent(agentCount: number): number {""",
              """/** Percentage of one tile edge before inter-tile gaps are subtracted in CSS.\n * @param agentCount - number of visible agents.\n * @returns the percentage width/height available to one tile.\n */\nexport function mosaicCellPercent(agentCount: number): number {""",
              1,
          )
          s = s.replace(
              """ * same cycle-safe root authority as family selection, so presentation cannot\n * accidentally elect the first rendered tile as leader.\n */\nexport function spatialAgentLineage<Id extends string>(""",
              """ * same cycle-safe root authority as family selection, so presentation cannot\n * accidentally elect the first rendered tile as leader.\n * @param id - Session identifier whose lineage is projected.\n * @param byId - locally-known Session facts keyed by id.\n * @returns the canonical root, direct parent, and graph depth.\n */\nexport function spatialAgentLineage<Id extends string>(""",
              1,
          )
          s = s.replace(
              """ * remain in Harness' workspace browser.\n *\n * Without a current Session there is no family anchor, so only actively\n * running Sessions surface as ambient work.\n */\nexport function canvasAgentIds<Id extends string>(""",
              """ * remain in Harness' workspace browser.\n *\n * Without a current Session there is no family anchor, so only actively\n * running Sessions surface as ambient work.\n * @param orderedIds - visible-order Session identifiers.\n * @param byId - locally-known Session facts keyed by id.\n * @param current - optional Session used as the family anchor.\n * @returns Session identifiers that belong on the spatial canvas.\n */\nexport function canvasAgentIds<Id extends string>(""",
              1,
          )
          s = s.replace(
              """ * Session transcript, so callers must present lifecycle/status only rather\n * than fabricating a conversation surface.\n */\nexport function canvasSubagentJobs<OwnerId extends string, JobId extends string>(""",
              """ * Session transcript, so callers must present lifecycle/status only rather\n * than fabricating a conversation surface.\n * @param orderedOwnerIds - canvas Session order used for stable projection.\n * @param jobsByOwner - one-shot jobs keyed by owner Session.\n * @returns active one-shot subagent jobs in canvas order.\n */\nexport function canvasSubagentJobs<OwnerId extends string, JobId extends string>(""",
              1,
          )
          p.write_text(s)

          # Public UI terminal emulator contracts also require complete JSDoc.
          p = Path('packages/client/ui-layout/src/client/terminal-vt.ts')
          s = p.read_text()
          s = s.replace(
              'export interface TerminalCell {',
              '/** One decoded terminal screen cell. */\nexport interface TerminalCell {', 1)
          s = s.replace(
              'export interface TerminalScreenSnapshot {',
              '/** Immutable snapshot of visible terminal cells and cursor state. */\nexport interface TerminalScreenSnapshot {', 1)
          s = s.replace(
              'export interface TerminalScreen {',
              '/** Stateful VT terminal emulator surface used by the client renderer. */\nexport interface TerminalScreen {', 1)
          s = s.replace(
              '/** Create an empty terminal screen. */\nexport function createTerminalScreen(rows: number, cols: number): TerminalScreen {',
              '/** Create an empty terminal screen.\n * @param rows - positive row count.\n * @param cols - positive column count.\n * @returns a mutable terminal screen model.\n */\nexport function createTerminalScreen(rows: number, cols: number): TerminalScreen {', 1)
          p.write_text(s)

          # Add repository-owned signature types to the Cordis type-link policy.
          p = Path('scripts/gen-cordis-catalog.ts')
          s = p.read_text()
          marker = "export const LINK_MAP: Readonly<Record<string, string>> = {"
          start = s.index(marker)
          end = s.index("\n}\n\n/**", start)
          additions = """
  SessionStopJobRequest: 'jobs.md',
  SessionStopJobValue: 'jobs.md',
  TerminalBackendsValue: 'terminal.md',
  TerminalListRequest: 'terminal.md',
  TerminalListValue: 'terminal.md',
  TerminalOpenRequest: 'terminal.md',
  TerminalOpenValue: 'terminal.md',
  TerminalWriteRequest: 'terminal.md',
  TerminalResizeRequest: 'terminal.md',
  TerminalSignalRequest: 'terminal.md',
  TerminalSignalValue: 'terminal.md',
  TerminalAddressRequest: 'terminal.md',
  TerminalCloseValue: 'terminal.md',
  TerminalOutputFrame: 'terminal.md',"""
          s = s[:end] + additions + s[end:]
          p.write_text(s)
          PY

          pnpm install --frozen-lockfile
          pnpm run gen-client-catalog
          pnpm run gen-config-catalog
          pnpm run gen-cordis-catalog
          pnpm run gen-doc-graphs
          pnpm run verify-translation-pairing --write docs/subsystems/terminal.md
          pnpm run verify-type-equiv
          pnpm run verify-export-jsdoc
          pnpm run duplication

          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/one-shot-regenerate-contracts.yml
          git commit -m 'ci: regenerate derived contracts [generated-contracts]'
          git push origin HEAD:nolane/spatial-agent-shell-v2
