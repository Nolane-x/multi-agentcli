name: CI runner bootstrap

on:
  push:
    branches:
      - nolane/spatial-agent-shell-v2

permissions:
  contents: write

jobs:
  normalize-pr-runner:
    name: normalize PR Linux runner
    runs-on: ubuntu-latest
    steps:
      # One-shot safety net for PRs that otherwise wait forever on the retired pool.
      - name: Normalize unavailable enterprise Linux runner
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: nolane/spatial-agent-shell-v2
          TARGET_PATH: .github/workflows/ci.yml
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.TARGET_BRANCH;
            const path = process.env.TARGET_PATH;
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: branch,
            });
            if (Array.isArray(response.data)) {
              core.setFailed(`${path} resolved to a directory`);
              return;
            }

            const current = Buffer.from(response.data.content, 'base64').toString('utf8');
            const needle = "|| 'dsh-ubuntu-24-04-16core' }}";
            const matches = current.split(needle).length - 1;
            if (matches === 0) {
              core.info('No unavailable enterprise Linux runner references remain.');
              return;
            }
            if (matches !== 3) {
              core.setFailed(`Expected exactly 3 Linux runner references, found ${matches}`);
              return;
            }

            const updated = current.replaceAll(needle, "|| 'ubuntu-latest' }}");
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: 'ci: normalize PR Linux runner availability',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: response.data.sha,
            });
            core.info('Normalized all three PR Linux gates to ubuntu-latest.');
