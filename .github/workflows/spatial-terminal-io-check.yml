name: Spatial terminal I/O diagnostics

on:
  push:
    branches:
      - nolane/spatial-agent-shell
    paths:
      - .github/workflows/spatial-terminal-io-check.yml

permissions:
  contents: write

jobs:
  terminal-io-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nolane/spatial-agent-shell
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Capture exact terminal interaction failure
        shell: bash
        run: |
          set +e
          pnpm exec vitest run packages/api/session-controller/tests/control-terminal.host.spec.ts > .github/spatial-terminal-io-debug.log 2>&1
          status=$?
          set -e
          cat .github/spatial-terminal-io-debug.log
          printf '\nexit_status=%s\n' "$status" >> .github/spatial-terminal-io-debug.log
      - name: Commit diagnostic log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/spatial-terminal-io-debug.log
          git commit -m "test: capture terminal io failure log"
          git push origin HEAD:nolane/spatial-agent-shell
