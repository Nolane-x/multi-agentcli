name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Detect repository configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          configured_repository=$(node -e "const c=require('./.github/issue-management/config.json'); process.stdout.write(c.organization + '/' + c.repository)")
          if [ "$configured_repository" = "$GITHUB_REPOSITORY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo "Issue lifecycle is configured for $GITHUB_REPOSITORY."
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "Issue lifecycle not configured for $GITHUB_REPOSITORY; trusted configuration targets $configured_repository. Passing without applying upstream lifecycle automation."
          fi
      - name: Detect project credentials
        id: credentials
        env:
          ISSUE_APP_CLIENT_ID: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          ISSUE_APP_PRIVATE_KEY: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ISSUE_APP_CLIENT_ID" ] && [ -n "$ISSUE_APP_PRIVATE_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create project token
        id: app-token
        if: ${{ steps.config.outputs.enabled == 'true' && steps.credentials.outputs.available == 'true' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Handle repository event
        if: ${{ steps.config.outputs.enabled == 'true' && steps.credentials.outputs.available == 'true' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') && steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle
      - name: Skip unconfigured lifecycle
        if: ${{ steps.config.outputs.enabled != 'true' }}
        run: echo "No issue-lifecycle configuration is enabled for $GITHUB_REPOSITORY."
      - name: Skip lifecycle without project credentials
        if: ${{ steps.config.outputs.enabled == 'true' && steps.credentials.outputs.available != 'true' }}
        run: echo "Issue lifecycle is configured, but its GitHub App credentials are unavailable; no project mutation was attempted."
