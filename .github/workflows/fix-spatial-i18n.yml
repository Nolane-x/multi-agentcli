name: Fix spatial i18n

on:
  push:
    branches:
      - nolane/spatial-agent-shell-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nolane/spatial-agent-shell-v2
          fetch-depth: 1

      - name: Patch spatial agent copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('packages/client/ui-layout/src/client/AppFrame.tsx')
          app = app_path.read_text()

          replacements = [
              (r"function AgentChrome\(props: \{\n  id:", "function AgentChrome(props: {\n  t: AppFrameProps['t']\n  id:"),
              (r"function SubagentJobTile\(props: \{\n  ownerId:", "function SubagentJobTile(props: {\n  t: AppFrameProps['t']\n  ownerId:"),
              (r"    : `\$\{sessionMeta\} · via \$\{props\.parentTitle\}`", "    : props.t('spatial.agent.via', { name: props.parentTitle })"),
              (r"    \? 'LEAD'", "    ? props.t('spatial.agent.lead')"),
              (r"      \? 'CHILD'", "      ? props.t('spatial.agent.child')"),
              (r"<span className=\{css\.liveBadge\}>LIVE</span>", "<span className={css.liveBadge}>{props.t('spatial.agent.live')}</span>"),
              (r"aria-label=\{`Open \$\{props\.title\}`\}", "aria-label={props.t('spatial.agent.open', { name: props.title })}"),
              (r"\{props\.running \? 'working' : 'ready'\}", "{props.running ? props.t('spatial.agent.working') : props.t('spatial.agent.ready')}"),
              (r"aria-label=\{props\.focused \? 'Return to agent mosaic' : 'Focus this agent'\}", "aria-label={props.focused ? props.t('spatial.agent.returnToMosaic') : props.t('spatial.agent.focus')}"),
              (r"title=\{props\.focused \? 'Return to mosaic \(Esc\)' : 'Focus agent'\}", "title={props.focused ? props.t('spatial.agent.returnToMosaicTitle') : props.t('spatial.agent.focusTitle')}"),
              (r"<span>\{props\.running \? 'agent is working in the background' : 'agent is ready'\}</span>", "<span>{props.running ? props.t('spatial.agent.backgroundWorking') : props.t('spatial.agent.backgroundReady')}</span>"),
              (r"<p>Open this agent to continue the full Harness session\.</p>", "<p>{props.t('spatial.agent.openToContinue')}</p>"),
              (r"<span className=\{css\.openHint\}>Enter agent <span aria-hidden=\"true\">↗</span></span>", "<span className={css.openHint}>{props.t('spatial.agent.enter')} <span aria-hidden=\"true\">↗</span></span>"),
              (r"aria-label=\{`\$\{props\.job\.label\}, one-shot subagent \$\{stopping \? 'stopping' : props\.job\.status\}\}`\}", "aria-label={props.t('spatial.agent.oneShotAria', { label: props.job.label, status: statusLabel })}"),
              (r"<span className=\{css\.leadBadge\}>ONE-SHOT</span>", "<span className={css.leadBadge}>{props.t('spatial.agent.oneShot')}</span>"),
              (r"              via \{props\.ownerTitle\}", "              {props.t('spatial.agent.via', { name: props.ownerTitle })}"),
              (r"  const stopping = props\.stopRequested \|\| props\.job\.status === 'stopping'\n", "  const stopping = props.stopRequested || props.job.status === 'stopping'\n  const statusLabel = props.job.status === 'running'\n    ? props.t('spatial.agent.status.running')\n    : props.job.status === 'completed'\n      ? props.t('spatial.agent.status.completed')\n      : props.job.status === 'killed'\n        ? props.t('spatial.agent.status.killed')\n        : props.job.status === 'failed'\n          ? props.t('spatial.agent.status.failed')\n          : props.t('spatial.agent.stopping')\n"),
              (r"\{stopping \? 'stopping' : props\.job\.status\}", "{statusLabel}"),
              (r"aria-label=\{props\.stopRequested \? `Stopping \$\{props\.job\.label\}` : `Stop \$\{props\.job\.label\}`\}", "aria-label={props.stopRequested ? props.t('spatial.agent.stoppingLabel', { name: props.job.label }) : props.t('spatial.agent.stopLabel', { name: props.job.label })}"),
              (r"title=\{props\.stopRequested \? 'Stop requested' : 'Stop one-shot agent'\}", "title={props.stopRequested ? props.t('spatial.agent.stopRequested') : props.t('spatial.agent.stopOneShot')}"),
              (r"<span>delegated by \{props\.ownerTitle\}</span>", "<span>{props.t('spatial.agent.delegatedBy', { name: props.ownerTitle })}</span>"),
              (r"<p>\{props\.job\.detail \?\? 'One-shot subagent execution is active\.'\}</p>", "<p>{props.job.detail ?? props.t('spatial.agent.executionActive')}</p>"),
              (r"<span className=\{css\.openHint\}>job:\{String\(props\.job\.id\)\.slice\(0, 12\)\}</span>", "<span className={css.openHint}>{props.t('spatial.agent.job', { id: String(props.job.id).slice(0, 12) })}</span>"),
              (r"                  title=\{summary\?\.displayTitle \?\? `Agent \$\{index \+ 1\}`\}", "                  t={t}\n                  title={summary?.displayTitle ?? `${t('spatial.agent.agent')} ${index + 1}`}"),
              (r"                  ownerId=\{ownerId\}\n                  ownerTitle", "                  t={t}\n                  ownerId={ownerId}\n                  ownerTitle"),
          ]
          for pattern, replacement in replacements:
              new_app, count = re.subn(pattern, replacement, app, count=1)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {pattern!r}, got {count}')
              app = new_app
          app_path.write_text(app)

          dictionaries = {
              'en': {
                  'spatial.agent.live':'LIVE','spatial.agent.open':'Open {name}','spatial.agent.working':'working','spatial.agent.ready':'ready',
                  'spatial.agent.returnToMosaic':'Return to agent mosaic','spatial.agent.focus':'Focus this agent','spatial.agent.returnToMosaicTitle':'Return to mosaic (Esc)','spatial.agent.focusTitle':'Focus agent',
                  'spatial.agent.backgroundWorking':'agent is working in the background','spatial.agent.backgroundReady':'agent is ready','spatial.agent.openToContinue':'Open this agent to continue the full Harness session.','spatial.agent.enter':'Enter agent',
                  'spatial.agent.lead':'LEAD','spatial.agent.child':'CHILD','spatial.agent.oneShotAria':'{label}, one-shot subagent {status}','spatial.agent.oneShot':'ONE-SHOT','spatial.agent.via':'via {name}',
                  'spatial.agent.stopping':'stopping','spatial.agent.status.running':'running','spatial.agent.status.completed':'completed','spatial.agent.status.killed':'killed','spatial.agent.status.failed':'failed',
                  'spatial.agent.stoppingLabel':'Stopping {name}','spatial.agent.stopLabel':'Stop {name}','spatial.agent.stopRequested':'Stop requested','spatial.agent.stopOneShot':'Stop one-shot agent','spatial.agent.delegatedBy':'delegated by {name}',
                  'spatial.agent.executionActive':'One-shot subagent execution is active.','spatial.agent.job':'job:{id}','spatial.agent.agent':'Agent'
              },
              'zh': {
                  'spatial.agent.live':'实时','spatial.agent.open':'打开 {name}','spatial.agent.working':'工作中','spatial.agent.ready':'就绪',
                  'spatial.agent.returnToMosaic':'返回智能体网格','spatial.agent.focus':'聚焦此智能体','spatial.agent.returnToMosaicTitle':'返回网格 (Esc)','spatial.agent.focusTitle':'聚焦智能体',
                  'spatial.agent.backgroundWorking':'智能体正在后台工作','spatial.agent.backgroundReady':'智能体已就绪','spatial.agent.openToContinue':'打开此智能体以继续完整 Harness 会话。','spatial.agent.enter':'进入智能体',
                  'spatial.agent.lead':'负责人','spatial.agent.child':'子智能体','spatial.agent.oneShotAria':'{label}，一次性子智能体，状态：{status}','spatial.agent.oneShot':'一次性','spatial.agent.via':'经由 {name}',
                  'spatial.agent.stopping':'正在停止','spatial.agent.status.running':'运行中','spatial.agent.status.completed':'已完成','spatial.agent.status.killed':'已终止','spatial.agent.status.failed':'失败',
                  'spatial.agent.stoppingLabel':'正在停止 {name}','spatial.agent.stopLabel':'停止 {name}','spatial.agent.stopRequested':'已请求停止','spatial.agent.stopOneShot':'停止一次性智能体','spatial.agent.delegatedBy':'由 {name} 委派',
                  'spatial.agent.executionActive':'一次性子智能体正在执行。','spatial.agent.job':'任务：{id}','spatial.agent.agent':'智能体'
              }
          }
          for lang, entries in dictionaries.items():
              path = Path(f'packages/client/locale/src/locales/{lang}.ts')
              text = path.read_text()
              if "'spatial.agent.live'" in text:
                  raise SystemExit(f'{path} already contains spatial keys')
              marker = '} satisfies Record<CommonKey, string>' if lang == 'en' else '} satisfies Record<string, string>'
              if marker not in text:
                  raise SystemExit(f'missing locale marker in {path}')
              block = ''.join(f"  '{k}': {v!r},\n" for k, v in entries.items())
              path.write_text(text.replace(marker, block + marker, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/client/ui-layout/src/client/AppFrame.tsx packages/client/locale/src/locales/en.ts packages/client/locale/src/locales/zh.ts
          git rm .github/workflows/fix-spatial-i18n.yml .github/workflows/ci-runner-bootstrap.yml
          git commit -m 'fix: localize spatial agent chrome'
          git push origin HEAD:nolane/spatial-agent-shell-v2
