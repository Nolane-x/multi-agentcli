name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

# Keep only the newest validation for a PR. Including github.sha here would
# create a distinct concurrency group per commit and prevent stale-run cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-24:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24 / static
    timeout-minutes: 30
    env:
      DSH_GATE_CONCURRENCY: '8'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:static

  node-24-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24 / coverage
    timeout-minutes: 45
    env:
      DSH_COVERAGE_MAX_WORKERS: '6'
      DSH_COVERAGE_PARTITIONS: '4'
      DSH_GATE_CONCURRENCY: '3'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"
      - name: Run exhaustive coverage
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:coverage

  node-24-snapshots:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24 / snapshots and artifacts
    timeout-minutes: 45
    env:
      DSH_GATE_CONCURRENCY: '4'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run snapshot and artifact gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:snapshots

  node-22:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 22.19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  node-24-9:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24.9
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  node-26:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  windows-node-24-coverage:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    name: windows node 24 / coverage
    timeout-minutes: 45
    env:
      DSH_COVERAGE_MAX_WORKERS: '4'
      DSH_COVERAGE_PARTITIONS: '6'
      DSH_GATE_CONCURRENCY: '2'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Windows coverage
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:coverage

  windows-node-24-observational:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    name: windows node 24 / observational
    timeout-minutes: 45
    env:
      DSH_GATE_CONCURRENCY: '2'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Windows observational gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:observational

  windows-node-24-build:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    name: windows node 24 / build
    timeout-minutes: 45
    env:
      DSH_GATE_CONCURRENCY: '2'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Windows build gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:build

  windows-node-24-wine-blocking:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    name: windows node 24 / wine blocking
    timeout-minutes: 45
    env:
      DSH_GATE_CONCURRENCY: '2'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Windows wine blocking gate
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:wine:blocking

  windows-node-24-native-tests:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    name: windows node 24 / native tests
    timeout-minutes: 45
    env:
      DSH_GATE_CONCURRENCY: '2'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run Windows native test inventory
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:native

  python-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: python runtime / release-shaped matrix / plan targets
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Plan Python runtime wheel targets
        id: plan
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('packages/sdk/python/pyproject.toml').read_text()) if False else None
          pyproject = Path('packages/sdk/python/pyproject.toml').read_text()
          version_line = next(line for line in pyproject.splitlines() if line.startswith('version = '))
          version = version_line.split('"')[1]
          matrix = {'include': [{'target': f'deepseek_harness_sdk-{version}-py3-none-any.whl'}]}
          Path(os.environ['GITHUB_OUTPUT']).write_text(
              f'version={version}\nmatrix={json.dumps(matrix, separators=(",", ":"))}\n'
          )
          PY

  python-runtime-wheel:
    if: github.event_name == 'pull_request'
    needs: python-runtime
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.python-runtime.outputs.matrix) }}
    runs-on: ubuntu-latest
    name: python runtime / release-shaped matrix / ${{ matrix.target }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Build and inspect wheel
        run: |
          python -m pip install --upgrade build
          python -m build packages/sdk/python --wheel
          test -f packages/sdk/python/dist/${{ matrix.target }}

  python-keyless-sdk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: python 3.10 / keyless SDK
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run keyless SDK checks
        run: python -m pytest packages/sdk/python/tests
