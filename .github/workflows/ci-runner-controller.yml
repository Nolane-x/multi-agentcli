name: CI runner controller

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  normalize-pr-runner:
    name: normalize PR Linux runner
    runs-on: ubuntu-latest
    steps:
      - name: Patch PR branch and remove controller
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: nolane/spatial-agent-shell-v2
          TARGET_PATH: .github/workflows/ci.yml
          CONTROLLER_PATH: .github/workflows/ci-runner-controller.yml
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.TARGET_BRANCH;
            const path = process.env.TARGET_PATH;
            const controllerPath = process.env.CONTROLLER_PATH;
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            if (Array.isArray(response.data)) throw new Error(`${path} resolved to a directory`);

            const current = Buffer.from(response.data.content, 'base64').toString('utf8');
            const needle = "|| 'dsh-ubuntu-24-04-16core' }}";
            const matches = current.split(needle).length - 1;
            if (matches !== 3) throw new Error(`Expected exactly 3 unavailable Linux runner references, found ${matches}`);
            const updated = current.replaceAll(needle, "|| 'ubuntu-latest' }}");

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: 'ci: normalize PR Linux runner availability',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: response.data.sha,
            });

            const controller = await github.rest.repos.getContent({ owner, repo, path: controllerPath, ref: 'master' });
            if (Array.isArray(controller.data)) throw new Error(`${controllerPath} resolved to a directory`);
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path: controllerPath,
              message: 'ci: remove temporary runner controller',
              sha: controller.data.sha,
              branch: 'master',
            });
            core.info('PR Linux runner references normalized and temporary controller removed.');
