name: desktop release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'apps/desktop/**'
      - 'packages/client/locale/**'
      - 'packages/client/ui-layout/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile:
    name: cargo lockfile
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Upload generated Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf \
            libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native PTY
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib

      - name: Build desktop bundles
        run: pnpm --filter @deepseek-ai/dsh-desktop tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dsh-spatial-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
            apps/desktop/src-tauri/Cargo.lock
            !apps/desktop/src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
